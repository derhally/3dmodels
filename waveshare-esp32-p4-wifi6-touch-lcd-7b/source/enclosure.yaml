# Desk enclosure for Waveshare ESP32-P4-WIFI6-Touch-LCD-7B. Units: mm, degrees.
# Display data from Waveshare's dimension drawing (20251108).

display:
  glass_w: 164.28        # cover glass (lens OD)
  glass_h: 99.17
  pcb_w: 164.0
  pcb_h: 97.0
  pcb_top_inset: 0.57    # PCB top edge below glass top edge
  lcd_back: 5.7          # glass front -> LCD back
  pcb_front: 7.2         # glass front -> PCB front
  pcb_back: 8.8          # glass front -> PCB back (mounting holes face this way)
  depth: 15.3            # glass front -> tallest rear component
  hole_inset: 4.0        # M2.5 threaded standoffs, 156 x 89 apart
  standoff_d: 5.4
  standoff_end: 15.0     # glass front -> standoff end (measured); hooks seat here
  usb_c_from_pcb_bottom: 28.85   # "USB" port (middle), on the left edge seen from the front
  # MEMS mics on the PCB back, ports facing into the enclosure
  mic_x: 67.9                    # +/- from centre (14.1 mm in from each PCB side)
  mic_above_pcb_bottom: 2.65

mic_holes:
  diameter: 1.2
  pitch: 2.0                     # 7-hole hex cluster under each mic
  below_opening: 5.0             # cluster centre below the glass opening

enclosure:
  angle: 45              # screen tilt from the desk
  wall: 2.4
  plate_t: 4.0           # front plate thickness; glass sits flush with its face
  pocket_clearance: 0.25 # per side around the glass
  pocket_trim_bottom: 0.1  # bottom edge of the cutout raised: 0.15 gap under the glass
  side_bezel: 10.5       # leaves ~8 mm beside the board for the right-angle USB-C plug
  top_bezel: 10.5
  min_front_lip: 8.0     # minimum height of the vertical lip under the chin
  rear_clearance: 2.0    # behind the deepest internal part

speaker:
  shape: rect            # round | rect
  diameter: 40.0         # round speakers
  width: 100.0           # rect speakers (along the chin)
  height: 45.0           # rect speakers (up the slope)
  depth: 20.75           # front face to back of box (measured)
  fit: 0.3               # per side in the retaining ring
  ring_height: 6.0
  margin: 4.0            # chin space around the speaker
  # corner mounting ears: 6.2 mm holes, inner edges 85 x 30 apart -> centres 91.2 x 36.2
  hole_d: 6.2
  hole_dx: 91.2
  hole_dy: 36.2
  ear_front: 10.0        # cone face -> cone-side face of the ear (measured)
  ear_t: 2.0
  notch_r: 4.5           # corner notch around each ear (assumed; stand-in only)
  standoff_d: 7.5        # under each ear
  spigot_d: 5.8          # locates in the ear hole
  spigot_h: 1.6          # below the ear thickness so the washer clamps
  pilot: 2.5             # M3 x 12 self-tapping + washer over the ear

screws:
  arm_thickness: 3.0     # display hooks; use M2.5 x 6 screws
  side_pilot: 2.5        # M3 self-tapping into plate bosses
  side_clear: 3.4

usb_notch:
  x: -70.0               # centre, seen from the front (negative = left)
  width: 12.0
  height: 9.0

feet:
  diameter: 10.0
  depth: 1.0
  inset: 14.0
