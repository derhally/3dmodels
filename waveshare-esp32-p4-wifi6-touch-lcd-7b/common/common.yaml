# Shared by every enclosure variant for the Waveshare ESP32-P4-WIFI6-Touch-LCD-7B.
# Units: mm, degrees. A variant's params.yaml overrides any key here.

display:                 # Waveshare dimension drawing (2025-11-08) + caliper measurements
  glass_w: 164.28        # cover glass (lens OD)
  glass_h: 99.17
  # visible (active) area and the black glass border around it, seen from the front
  va_w: 154.58
  va_h: 86.42
  border_left: 3.06
  border_right: 6.64
  border_top: 4.02
  border_bottom: 8.73
  pcb_w: 164.0
  pcb_h: 97.0
  pcb_top_inset: 0.57    # PCB top edge below glass top edge
  lcd_back: 5.7          # glass front -> LCD back
  pcb_front: 7.2         # glass front -> PCB front
  pcb_back: 8.8          # glass front -> PCB back (mounting holes face this way)
  depth: 15.3            # glass front -> tallest rear component
  hole_inset: 4.0        # M2.5 threaded standoffs, 156 x 89 apart
  standoff_d: 5.4
  standoff_end: 15.0     # glass front -> standoff end (measured); clamp tabs seat here
  usb_c_from_pcb_bottom: 28.85   # "USB" port (middle), on the left edge seen from the front
  # MEMS mics on the PCB back, ports facing into the enclosure
  mic_x: 67.9                    # +/- from PCB centre (14.1 mm in from each PCB side)
  mic_above_pcb_bottom: 2.65

speaker:                 # 28 x 31 enclosed speaker with two screw ears (Zeid, 2026-11-22: seller
                         # sheet plus his caliper readings A-E on the marked photo); replaces the
                         # 100 x 45 two-cone box, which is in git history
  width: 28.0            # body across, ears on these sides (seller sheet)
  height: 31.0           # body tall; the lead leaves this edge (seller sheet)
  depth: 15.0            # cone face to back (seller sheet)
  opening_d: 25.0        # round opening round the cone (measured, E)
  ear_span: 43.0         # across both ears (seller sheet)
  ear_w: 11.0            # ear tab at the body (ASSUMED from the photo)
  ear_tip_r: 3.3         # ear's round end round the hole (ASSUMED from the photo)
  hole_d: 2.2            # ear hole (measured, B): M2
  hole_dx: 36.75         # ear hole centres (measured, A)
  hole_dy: 0.0           # one ear each side, on the centre line
  ear_front: 6.65        # cone face -> cone-side face of the ear (measured, D)
  ear_t: 2.83            # ear thickness (measured, C)
  standoff_d: 5.0        # printed standoff under each ear
  spigot_d: 0.0          # none: the 2.2 hole takes only the screw
  spigot_h: 0.0
  pilot: 1.6             # M2 x 6 self-tapping: 2.83 ear + 3.2 into the pilot

mic_holes:
  diameter: 1.2
  pitch: 2.0             # 7-hole hex cluster under each mic
  below_opening: 5.0     # cluster centre below the glass pocket

enclosure:
  angle: 55              # screen tilt from the desk (Zeid, 2026-11-22: 55, less deep than 45)
  wall: 2.4
  facade_t: 1.6          # front skin over the glass border
  pocket_depth: 4.0      # glass pocket behind the facade; plate = facade + pocket
  window_reveal: 0.5     # window larger than the visible area, per side
  window_chamfer: 1.2    # 45 deg bevel on the window's front edge
  pocket_clearance: 0.25 # per side around the glass
  pocket_trim_bottom: 0.1  # bottom edge of the pocket raised: 0.15 gap under the glass
  min_front_lip: 8.0     # minimum height of the vertical lip under the screen
  rear_clearance: 2.0    # behind the deepest internal part

clamps:
  column: 7.0            # square column beside the pocket, top flush with the standoff ends
  column_gap: 0.3        # column to pocket edge
  pilot: 2.5             # M3 x 8 self-tapping into the column
  pilot_depth: 8.0
  tab_t: 3.0             # printed tab: M2.5 x 6 into the standoff, M3 x 8 into the column
  tab_w: 7.0
  standoff_hole: 2.8
  column_slot: 3.4

screws:
  side_pilot: 2.5        # M3 self-tapping into plate bosses
  side_clear: 3.4

usb_port:                # panel-mount USB-C port in the back wall
  enabled: true
  style: screw           # screw: flanged connector screwed on from outside; snap: snap-in socket
  x: 0.0                 # centre, seen from the front (negative = left); centred (Zeid, 2026-11-22)
  z: 8.0                 # centre height above the desk: flange pocket 1.2 above the inside floor
  # style: screw. Flange inside the wall in a pocket, two screws from the outside,
  # flat outside face. Flange and holes from the seller drawing, protrusion measured;
  # fit confirmed with a printed test plate.
  screw_flange: [25.2, 8.2]  # rounded-end flange
  screw_pitch: 17.0      # screw hole centres
  screw_hole: 2.7        # clearance for the screws through the 2.5 flange holes
  socket: [9.0, 3.4]     # socket body through the wall
  socket_clearance: 0.3  # per side
  flange_clearance: 0.3  # per side around the flange pocket
  protrusion: 1.3        # socket face beyond the flange: wall left at the socket, so it ends flush
  screw_body: [13.0, 7.0, 19.5]  # behind the flange: width, height, depth (stand-in only; depth from the seller, rest assumed)
  # style: snap
  cutout: [14.1, 5.75]   # panel hole (measured)
  corner_r: 1.3
  panel_t: 2.5           # panel thickness the clips latch on (measured); the wall is
                         # thickened to this if thinner by more than 0.2, thinned if thicker
  pad_margin: 3.0        # extent of any thickened/thinned panel around the flange
  flange: [16.7, 10.3, 2.0]  # oval bezel on the outside (thickness assumed; stand-in only)
  body: [12.0, 5.3, 12.0]    # behind the panel: width, height, depth (stand-in only)
  clip_span: [16.04, 4.27]   # snap clips open to this width over this length (stand-in only)

usb_notch:               # cable notch at the bottom of the back wall (instead of the port)
  enabled: false
  x: -70.0
  width: 12.0
  height: 9.0

feet:
  diameter: 10.0
  depth: 1.0
  inset: 14.0

print_bed: [330, 320]    # Bambu Lab H2C; nightstand/check.py's bed-fit check (the 3MFs use ../../bambu/project_settings.config's printer)

print:                   # Bambu Studio settings written into every 3MF, on top of ../../bambu/project_settings.config
  project:
    wall_loops: 3        # the variants' READMEs: 3+ walls
