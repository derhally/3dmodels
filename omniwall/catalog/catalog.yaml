  - id: panel
    kind: reference
    category: reference
    name: Omniwall panel
    folder: omniwall
    status: reference
    summary: >-
      The steel panel: a 25.4 mm grid, each cell boxed in by four 3.0 × 15.5 mm
      slots with a 6.2 mm peg hole in its middle.
    image: omniwall/panel-diagram.svg
    how: >-
      Neighbouring cells share slots. The hole sits midway between the slots on
      both axes, so slot centrelines lie on the grid lines and the holes on a grid
      offset by half a pitch. Every part takes its numbers from panel.yaml rather
      than retyping them.
    specs:
      Pitch: 25.4 mm both ways
      Slot: 3.0 × 15.5 mm
      Peg hole: Ø6.2 mm
      Steel: 18 ga, 1.55 mm (measured)
      Between in-line slots: 9.9 mm of steel
      Hole edge to slot: 8.1 mm
    downloads:
      - omniwall/panel.yaml
      - omniwall/README.md
