  - id: arc-drawer-3x2x60
    kind: drawer
    category: drawers
    name: Arc drawer 3×2×60
    folder: omniwall/arc-drawer/3x2x60
    prefix: arc_drawer_3x2x60
    status: design
    summary: Three cells wide, two rows tall, 60 mm deep.
    how: >-
      The housing hangs on Bridge hook 1Us in two slot columns, in the top row or
      both rows. Pull the scoop and the drawer slides out on two rear pins
      running in grooves in the housing walls; at the end of its travel it tilts
      down 30° and stays captive. To take it out, tilt it fully, push it back
      along the gate, lift it round the stop and pull it forward. Units of the
      same depth tile together; units of different depths line up at the panel,
      not at the front.
    specs:
      Housing: 75.9 × 60 × 50.5 mm (W × D × H)
      Drawer inside: 64.9 × 41.4 × 40 mm
      Travel: 31.9 mm, then a 30° tilt
      Hooks: Bridge hook 1U, 2 columns, 1 or 2 rows
      Grid: 3 × 2 cells, 0.3 mm gap to neighbours
