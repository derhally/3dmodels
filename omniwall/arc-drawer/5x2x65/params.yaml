# Omniwall arc-pocket drawer, 5 cells x 2 rows, 65 mm deep (Zeid asked 2026-10-27).
# Everything not set here comes from ../params.yaml (the shared defaults), section by
# section and key by key. Build with ../build.py 5x2x65 (see ../README.md).
# 126.7 wide: four hook columns (25.25, 50.65, 76.05, 101.45), two hook rows.
unit:
  cells: 5                       # given: 5 cells wide
  depth: 65                      # given: 65 mm deep
  file_prefix: arc_drawer_5x2x65 # output files: arc_drawer_5x2x65_all_parts.3mf and so on

track:
  stop: 49.5                     # derived: depth - 15.5, the same as 68.5 in the 84 deep defaults, so the arc, gate, hook and exit sit the same distance from the front
