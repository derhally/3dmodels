# Omniwall arc-pocket drawer, 3 cells x 3 rows, 65 mm deep (60 until 2026-10-27; Zeid asked 2026-10-18).
# Everything not set here comes from ../params.yaml (the 3 x 2 unit), section by
# section and key by key. Build with ../build.py 3x3x65 (see ../README.md).
# 75.9 wide x 75.9 tall: two hook columns (25.25 and 50.65), three hook rows.
# The pocket channels have snap ridges for all three rows.
unit:
  cells: 3                       # given: 3 cells wide
  rows: 3                        # given: 3 rows tall
  depth: 65                      # given (Zeid, 2026-10-27: the 60 deep drawers go to 65)
  file_prefix: arc_drawer_3x3x65 # output files: arc_drawer_3x3x65_housing_print.3mf and so on

track:
  stop: 49.5                     # derived: depth - 15.5, the same as 68.5 in the 84 deep unit, so the arc, gate, hook and exit sit the same distance from the front
