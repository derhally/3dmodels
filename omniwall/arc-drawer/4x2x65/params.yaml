# Omniwall arc-pocket drawer, 4 cells x 2 rows, 65 mm deep (60 until 2026-10-27; Zeid asked 2026-10-19).
# Everything not set here comes from ../params.yaml (the shared defaults), section by
# section and key by key. Build with ../build.py 4x2x65 (see ../README.md).
# 101.3 wide: three hook columns (25.25, 50.65, 76.05), two hook rows.
unit:
  cells: 4                       # given: 4 cells wide
  depth: 65                      # given (Zeid, 2026-10-27: the 60 deep drawers go to 65)
  file_prefix: arc_drawer_4x2x65 # output files: arc_drawer_4x2x65_all_parts.3mf and so on

track:
  stop: 49.5                     # derived: depth - 15.5, the same as 68.5 in the 84 deep defaults, so the arc, gate, hook and exit sit the same distance from the front
