# Omniwall arc-pocket drawer, 2 cells x 2 rows, 60 mm deep (Zeid asked 2026-10-17
# for the 2 x 2; 2026-10-19 made it 60 deep and renamed the folder 2x2x60).
# Everything not set here comes from ../params.yaml (the 3 x 2 unit, 84 deep),
# section by section and key by key. Build with ../build.py 2x2x60 (see ../README.md).
# 50.5 wide: one hook column on the unit's centre line (25.25), one dovetail
# channel with ridges for both hook rows, same mechanism, handle and label holder.
unit:
  cells: 2                       # given: 2 cells wide
  rows: 2                        # given: 2 rows tall
  depth: 60                      # given (Zeid, 2026-10-19): 60 mm deep
  file_prefix: arc_drawer_2x2x60 # output files: arc_drawer_2x2x60_all_parts.3mf and so on

track:
  stop: 44.5                     # derived: depth - 15.5, the same as 68.5 in the 84 deep unit, so the arc, gate, hook and exit sit the same distance from the front

scoop_pins:
  width: 40.0                    # the 2x2 face is only 43.5 wide and its r4 top corners leave 41.4 at the recess top, so the scoop is 40 here (46 on the 3-cell drawers)
  front_width: 24.0              # given (Zeid, 2026-10-19: handles look the same on all sizes): 6 narrower than the face width, like 46/30, so the sides have the same angle
  boss_x: 11.75                  # sockets in with the sides: 14.7 clear between the tubes for a finger
