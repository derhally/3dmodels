# Omniwall arc-pocket drawer, 3 cells x 2 rows, 90 mm deep (Zeid asked 2026-10-19).
# Everything not set here comes from ../params.yaml (the shared defaults), section by
# section and key by key. Build with ../build.py 3x2x90 (see ../README.md).
unit:
  depth: 90                      # given: 90 mm deep
  file_prefix: arc_drawer_3x2x90 # output files: arc_drawer_3x2x90_all_parts.3mf and so on

track:
  stop: 74.5                     # derived: depth - 15.5, the same as 68.5 in the 84 deep defaults, so the arc, gate, hook and exit sit the same distance from the front
