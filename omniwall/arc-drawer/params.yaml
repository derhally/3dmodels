# Omniwall arc-pocket drawer (own design, 2026-10-17): a housing that hangs on the
# printed Bridge hook 1Us, and a drawer that slides out on two rear pins, tilts
# down 30 deg at the end of its travel and stays captive. Panel, hook and pocket
# values come from ../panel.yaml (dovetail_mount); the pockets are built by
# ../hook_geometry.py so they match the print-tested hooks. All sizes in mm.
# Source tags: given (Zeid), derived, assumed (chosen; the fit test checks it).
#
# Grid placement (derived from the hook geometry): a Bridge hook 1U straddles the
# horizontal slot row, so it sits at a crossing of the slot grid. Sideways, the
# unit's edges sit on vertical slot columns (as the bins do), so every column
# inside the unit takes a hook: cells - 1 of them. Vertically the unit's bottom
# edge sits on a peg-hole row, so every hook row is inside it: `rows` of them.
# Each column has one pocket channel from the bottom edge up to a closed seat at
# the top row's hook top, with snap ridges for every row, so the unit hangs on
# the top row of hooks alone or on more rows.

unit:
  cells: 3                 # given: 3 cells wide
  rows: 2                  # given: 2 rows tall
  channels: null           # pocket columns across the back: null = one at every seam (cells - 1); a number keeps both ends and works inward from the edges (Zeid, 2026-10-30; configurator)
  hook_rows: null          # rows that take hooks, counted from the top (1 = top row): null = top and bottom on units 3+ rows tall (segmented pockets, Zeid 2026-10-31), else one channel down every row; the configurator can pick others (at least 2 rows apart)
  gap: 0.3                 # assumed: gap between tiled neighbours; width = cells x pitch - gap, height = rows x pitch - gap (NOT the bins' +3.0, which cannot tile)
  depth: 84                # assumed: housing from the panel face to its front

housing:
  side: 3.2                # given (Zeid, 2026-10-18: the track showed through the 1.2 left behind the groove; was 2.4): side wall; the 1.2 track groove leaves 2.0 (5 perimeters)
  roof: 2.0                # assumed
  floor: 3.0               # assumed: the drawer slides on it; its front edge is the tilt pivot (sill)
  back_front_wall: 2.0     # assumed: solid in front of the pocket floor gable (back plate = 6.5 + 1.725 + 2.0 = 10.225)
  hull_slot:                # Zeid, 2026-10-27: empty slot inside all four outer walls so the back plate's solid top layers don't show as a hull line outside
    inset: 0.85            # assumed: outer face to the slot, the 2 outer wall lines (0.42 + 0.45)
    width: 0.4             # given (Zeid, 2026-10-27: the test print with 0.4 and 0.1 side by side, 0.4 looked best): slicer walls each side; roof keeps 0.75 behind it for the slot's top 1 mm above the plate
    below_plate: 1.1       # given (Zeid, 2026-10-27: about 1 mm either side of the junction): starts this far below the back plate's top (8.975), under its 5 solid top layers
    past_plate: 1.0        # given (Zeid): ends this far past the back plate (11.075); the track groove's back end dips to 10.825, leaving 0.75 of wall between them there
    pocket_margin: 1.0     # assumed: solid this far either side of each pocket where it opens in the bottom face
  ridges_every_row: true   # a ridge pair every pitch below the seat, one per hook row, so every row of hooks clicks in (Zeid, 2026-10-18: snaps at every row, never in between)
  pocket:                  # print-tested 2026-10-17: pocket_variants coupon 3 clicked best (Zeid). Overrides panel.yaml dovetail_mount.pocket for the housing only
    spine_clearance: -0.1  # lips' 45 deg back starts 0.1 below the spine's front (pocket_variants.gable_drop), so the print gable no longer thins them
    flank_gap: 0.1         # lip flank 0.1 behind the hook's flank (was 0.4)
    ridge_height: 0.53     # snap ridges: 0.28 interference per side with the 0.25 side clearance (was 0.333)

drawer:
  side_clearance: 0.3      # assumed: per side to the housing walls
  back_clearance: 0.5      # assumed: closed drawer back to the back plate
  wall: 2.0                # assumed: side and rear walls
  floor: 2.0               # assumed
  front_thickness: 6.0     # assumed: front plate (carries the lip and label holder; its bottom front edge pivots on the sill)
  top_gap: 0.5              # given (Zeid, 2026-10-17: smaller gap above the face; was 1.0): plate top below the roof. Only matters while the plate is inside the housing (closed or sliding level); tilting and leaving happen with the plate outside
  corner_radius: 4.0       # given (Zeid, 2026-10-17, approved in SolidCraft): front plate's top two corners, cut along the whole drawer so the side walls' outer top edge follows the curve
  headroom: 3.5            # assumed: side walls below the roof (the walls inside the housing while tilted or leaving are the lower shoulder)
  shoulder_length: 30      # derived: rear walls lowered over this length (sized for the old lift notch; build.py checks the gate, hook and exit clear)
  lift_clearance: 0.5      # assumed: sets the lowered rear walls' height from the exit channel's height

pins:                      # teardrop pins on the drawer's rear side faces, in the housing's track
  diameter: 3.0            # assumed
  from_back: 2.0           # assumed: pin centre from the drawer's back face
  height: 14.0             # assumed: pin centre above the unit's bottom edge (groove centre)
  reach: 1.0               # assumed: into the 1.2 groove, 0.2 off its floor
  point_angle: 45          # derived: teardrop point downward so the pin prints upright on the drawer
  flat_point: true         # Zeid, 2026-10-18 (narrower track): the point is cut flat at the pin's radius (a 1.24 wide flat), so the pin turns inside a 3.0 circle and the track is one pin + clearance wide (3.5, was 4.74); the flat is chamfered 45 deg from the drawer wall up to the pin's end (Zeid), so nothing faces flat down

track:                     # channel in each housing side wall that the drawer's pins run in
  depth: 1.2               # assumed
  clearance: 0.25          # assumed: around the pin (test print)
  stop: 68.5               # assumed: pin centre at full travel (76 % of the drawer out); the arc starts here
  tilt: 31                 # given (Zeid, 2026-10-27: one degree more tilt; was 30): the arc about the sill ends here; the drawer hangs open at this tilt
  gate: 6.0                # assumed: the tipped drawer is pushed this far back before the hook, along a curve with the arc's radius (Zeid, 2026-10-18: the gate curves like the arc); it lifts the drawer, so let go it slides back to the arc's end
  hook_radius: 2.8         # assumed: centre line radius of the hook, which curves up round the tongue of wall and forward into the exit channel (the tongue's tip is rounded 1.05)
  stop_round: 3.0          # given (Zeid, 2026-10-18: round the sharp corner across from the stop, where the tilt starts); radius where the groove's ceiling meets the arc
  nub_round: 1.0           # given (Zeid, 2026-10-18: no sharp turns): the nub of wall between the arc and the gate
  # No opening above the groove (Zeid, 2026-10-18: a drawer let go as its pins passed the old lift notch rose into it and fell out).
  # Way out (Zeid's sketch, 2026-10-18): the arc as before to 30 deg, then back along the gate and round the hook into the exit
  # channel, an S of smooth curves. The whole track is the pin centre's path swept by one circle: the teardrop pin's point
  # + clearance (4.74 wide), so the pin fits however the drawer turns and every wall is a line or an arc.

front:
  pull: scoop_pins         # given (Zeid, 2026-10-19): his scoop's look on the plate handle's snap pins (scoop_pins:); "handle" is the plate handle, "scoop" and "lip" are moulded on

scoop:                     # Zeid's scoop_prototype.scad (E:\source\openscad\omniwall\drawers), turned 180 deg so it opens downward
  width: 40.0              # given (scad width): side walls' span at the drawer face
  front_width: 16.0        # given (scad front_width): front wall, outer edge to outer edge
  depth: 10.0              # given (scad depth): tray depth, face to front wall
  height: 8.0              # given (scad height): wall height
  wall: 2.0                # given (scad wall)
  angle: 45                # given (scad handle_angle): tray tilt from the face
  embed: 0.5               # assumed: reaches this far into the front plate so the fuse has no coincident faces
  below_top: 2.0           # assumed: scoop top this far below the plate top, so the blend has a face to run onto (it was flush)
  blend: 2.0               # given (Zeid asked to blend the scoop into the face, 2026-10-17); 2 = the scad's back_fillet_r
  lip_flat: 1.5            # given (Zeid, 2026-10-18: the front wall's lip printed almost in the air): flat underside this far up from the lip's knife edge, so its first layers bridge between the side walls; 0 = knife edge
  # Not carried over: the scad's 0.5 mm rounding of every edge (the rim's would face down flatter than 45 deg) and its r2 back fillets

lip:                       # finger lip along the top of the drawer front (front.pull: lip); replaced by the scoop 2026-10-17
  proud: 8.0               # assumed: how far it stands out
  front_height: 3.0        # assumed: vertical front edge to hook a fingertip under
  underside_angle: 45      # derived: so it prints upright with no overhang (concave underside would overhang)

label:                     # U holder at the bottom of the face, open at the top: the label drops in
  width: 34.7              # given: bin-label plate (../../labels/bin-label)
  height: 10.85            # given
  thickness: 0.9           # given
  side_clearance: 0.15     # assumed: per side
  thickness_clearance: 0.3 # assumed: groove 1.2 for the 0.9 plate
  rail: 1.2                # assumed: rail and return thickness
  return: 1.5              # assumed: how far each side rail wraps over the label's edge
  bottom_clear: 0.5        # assumed: bottom rail's chamfer starts this far above the plate's bottom edge
  top_clear: 0.45          # assumed: side rails above the label's top
  blend: 0                 # Zeid tried a 1.2 blend on the outside edges and prefers it without (2026-10-17)

fit_test:                  # short sections to print first: pin/track fit, drop-in loading, the way out, and one pocket in this print orientation
  housing_length: 34       # assumed: front part of the housing with the arc, gate, hook and exit
  drawer_length: 40        # assumed: rear part of the drawer with the pins and shoulder
  coupon_half_width: 6.0   # assumed: pocket coupon either side of the hook column
  coupon_bottom: 12.0      # assumed: coupon from here to the unit top (both ridge pairs and the seat)

pocket_variants:           # pocket_variants.py: back-down pocket coupons to pick lip and ridge values (the first coupon was loose, 2026-10-17)
  gable_drop: 0.1          # assumed: lips' 45 deg back starts this far below the spine's front (y 2.4, not 2.65); clears the spine corner by 0.17 and keeps 0.33 at the lip tip
  flank_gap: 0.1           # assumed: was 0.4 (Kong); lip flank 0.2 behind the hook's flank, so the head is held almost tight to the panel
  ridge_heights: [0.333, 0.43, 0.53]   # coupons 1, 2, 3: 0.083 (the plate that clicked), 0.18, 0.28 interference per side; coupon 4 is the tested pocket unchanged
  width: 12.0              # assumed: coupon width across, pocket centred
  front_wall: 2.0          # as housing.back_front_wall
  below_hook: 4.0          # assumed: coupon runs this far below the seated hook (open end)
  roof: 2.0                # assumed: solid above the seat
  mark_depth: 0.4          # assumed: ID grooves on the front face

handle:                    # front.pull: handle. A plate handle on a stand-off rib like Zeid's HANDLE H2 (C:\Users\zeidd\Downloads\obj_20_HANDLE H2.stl), held on the drawer face by two printed snap pins (Zeid, 2026-10-18); handle_geometry.py
  # The handle prints on its top (the rib's top and the plate's top edge, flush): the plate then rises 15 deg off vertical,
  # the sockets run sideways as teardrops and their snap shoulders are vertical, so nothing needs supports.
  width: 40.0              # given (scoop.width): plate width, so it fits the 2x2x60 drawer too (H2: 80)
  drop: 20.0               # assumed: plate length down from the handle's top, along the plate (H2: 20)
  thickness: 3.0           # measured on H2: plate thickness
  lean: 15                 # measured on H2: plate leans out this far from the face
  standoff: 6.0            # given (Zeid, 2026-10-19: the 10 mm test handle reached out too far; his finger is 8.8 thick): rib length, face to the plate's inner face at the top (H2: 9). The gap widens with the lean to 11.2 at the plate's bottom edge and is over 8.8 for its lower 9 mm; the handle reaches 14.1 out (was 18.1)
  below_top: 2.0           # = scoop.below_top: handle top this far below the face top
  rib: 6.0                 # measured on H2: rib height between the bosses
  boss: 10.0               # measured on H2: boss width at each end of the rib (flat-topped here, round below)
  boss_height: 12.7        # assumed: boss depth below the handle's top (H2: 10), so the chamber's teardrop point keeps 2.2 mm of wall
  socket_down: 5.7         # assumed: socket axis this far below the handle's top (2.3 mm over the chamber), so the face's counterbore teardrop point stays 1 mm under the face top
  boss_x: 14.0             # assumed: socket centres either side of the middle (bosses reach 19, the plate 20)
  taper: 5.0               # assumed: rib grows into each boss over this length (H2: 12; shorter here to leave the finger gap 18 mm clear at full depth)
  corner_radius: 5.0       # measured on H2: plate's lower corners
  top_chamfer: 2.0         # assumed: 45 deg on the plate's top corners, which sit on the bed as printed
  socket_entry: 5.2        # assumed: socket in each boss, first part (teardrop, point down in use = up as printed), cut to hole_width across
  socket_entry_depth: 2.0  # assumed: shoulder here that the barbs catch behind
  socket_chamber: 6.8      # assumed: wider chamber the legs spring out in
  socket_depth: 5.5        # assumed: chamber end (the pin tip reaches 4.65 with barbs 6.4)
  hole: 5.2                # assumed: through the face; teardrop, point up (it runs sideways when the drawer prints), cut to hole_width across
  hole_width: 3.74         # derived: flats + 0.2, so the pin can't slide sideways (first test: pins lay flats-up in round holes and the handle moved 0.8 mm up and down, Zeid 2026-10-18)
  counterbore: 9.4         # assumed: for the pin head, on the inside of the face
  counterbore_depth: 2.0   # assumed: head sits flush
  shank: 5.0               # assumed: pin shank
  flats: 3.54              # derived: pin thickness between its two flats (shank radius x sin 45 x 2), so it prints lying on a flat with nothing flatter than 45 deg
  head: 9.0                # assumed
  head_thick: 2.0          # = counterbore_depth
  slot: 1.4                # assumed: splits the shank into two legs that bend in the bed plane (up and down when fitted: the pin goes in flats sideways)
  slot_start: 4.0          # assumed: from the head's back face
  barb_ramp: 30            # assumed: back of each barb slopes this far off square, so the legs pull the handle tight against the face (first test: 0.15 end play left the handle loose at the bottom)
  barb_preload: 0.25       # assumed: seated, the ramp meets the shoulder edge with the legs still this much squeezed (takes up -0.14 / +0.1 to 0.2 of length error)
  barb_flat: 0.5           # assumed
  tip: 1.2                 # assumed: tip radius after the 45 deg lead-in
  barb: 6.4                # given (Zeid, 2026-10-19): pin C of the handle test held best

scoop_pins:                # front.pull: scoop_pins. Zeid's scoop look (scoop:) as a separate part on the plate handle's snap pins (Zeid, 2026-10-19: the scoop looked nicer); values here override handle:
  kind: scoop_pins
  # The old scoop stands 7 out, too shallow for a socket (8.5 behind the handle's back), so this one is deeper and wider at the front.
  width: 50.0              # given (Zeid, 2026-10-28: flatter sides, wider back; was 46, before that 40): at the face. Each side steps in 10 over the 11 reach, 42 deg off straight out (was 36), so the side edge is 48 deg from horizontal seen from the front; printed on its back that is the side walls' inside overhang, still under 45. The 2x2x65 is 40 with a 20 lip, the same side angle (its face is only 43.5 wide; see 2x2x65/params.yaml)
  front_width: 30.0        # assumed: at the lip (old scoop 16), 20 narrower than the back; wide enough that the socket tubes stay inside the tapering sides
  reach: 11.0              # assumed: lip this far out from the face (old scoop 7.07, plate handle 14.1)
  height: 16.5             # assumed: back's height; its bottom stays 11.6 above the label holder so a label (10.85) still drops in from above
  below_top: 1.5           # assumed: top this far below the face top (1.35 of face left above the recess)
  lip: 1.5                 # assumed: front lip's height below the 45 deg top
  wall: 2.0                # = scoop.wall
  recess: 2.0              # assumed: the back plate sits this deep in the face; the pin's neck is shorter by the same amount
  recess_clearance: 0.15   # assumed: per side around the back plate
  round: 1.0               # assumed: rounds every edge that shows (Zeid likes polished, rounded corners)
  boss_x: 13.25            # assumed: socket centres either side of the middle; 17.7 clear between the tubes for a finger
  socket_down: 11.75       # assumed: socket axis below the top: tube top 1.35 under the 45 deg top, bottom 0.35 over the hood's bottom
  tube: 8.8                # assumed: socket tube, chamber 6.8 + 1.0 walls
  tube_end: 6.0            # assumed: tube end, out from the face
  chamber_past_barbs: 0.5  # assumed: straight chamber this far past the barbs' flat, then a 45 deg cone
  slot_start: 2.0          # derived: the leg slot starts at the head (was 4), so the legs and barbs are pin C's, only the neck is 2 shorter

scoop_test:                # scoop_test.py: test print of the scoop on its pins (scoop_pins: section)
  strip_width: 60.0        # assumed: strip of drawer face, wide enough for the recess (50) and 5 mm either side (Zeid, 2026-10-28: was 56 for the 46 scoop)
  strip_height: 24.0       # assumed: from the face top down, 5.5 below the scoop's bottom
  pins: 4                  # two to fit, two spare

handle_test:               # handle_test.py: test print of the handle (handle: section) on strips of drawer face, one set per pin variant
  strip_width: 44.0        # assumed: strip of drawer face for the test, just wider than the handle (one per set: strip, handle, a pin pair)
  strip_height: 16.0       # assumed: the top 16 mm of the face, enough round the pin holes
  # the strip is drawer.front_thickness (6.0) thick and prints standing up like the drawer face
  barbs: [6.0, 6.2, 6.4]   # assumed: pin variants A, B, C, across the barbs; the hole is 5.2. A has a plain head, B a notch at one end, C at both ends
  id_notch: 1.5            # assumed: depth of the V notches that mark pins B and C (the first test's 0.3 mm notches couldn't be seen)
