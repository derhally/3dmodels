# The Ramp 6 cells wide with less of a scoop (Zeid asked 2026-10-19; "looks good").
# Everything not set here comes from ../params.yaml.
unit:
  style: ramp
  file_prefix: tray_ramp_6x1

tray:
  cells: 6                 # given (Zeid): 6 cells wide = 152.1, five hook pockets

ramp:
  lip: 7.5                 # assumed: lowered with the floor so the bead stays 2.6 high
  front_floor: 4.9         # assumed: half the tilt (3.0 deg, was 6.0), so less of a dip toward the wall
  back_cove: 5.0           # assumed: half the curve into the back wall (was 10)
