# Pocket test plate: a small plate with two dovetail pockets that slides onto two
# hooks, to test the fit and the snap before designing boxes. Hook and pocket
# values come from ../panel.yaml (bridge_hook.dovetail and .pocket).
plate:
  hook_spacing_cells: 1   # given: wide enough for two hooks; 1 cell apart is the smallest
  side_wall: 3.0          # assumed: solid beside each pocket
  front_wall: 2.0         # assumed: solid in front of the pocket floor (plate is 8.35 thick)
  below_hook: 3.0         # assumed: plate runs this far below the hooks so the open ends are clear
  roof: 2.15              # assumed: solid above the pockets' closed tops
