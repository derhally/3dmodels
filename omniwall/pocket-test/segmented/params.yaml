# Segmented pocket test (Zeid, 2026-10-30): one pocket column with a seat on several
# hook rows, so a part taller than two rows hangs on several hooks and each
# seat carries weight. Hold the plate `push` high, push it straight onto the panel
# (each hook head goes into a window), then push it down `push`: the lips slide over
# the heads, the snaps click and every seat sits on its hook.
# Layout A on Bridge hook 1U (4.4 of lips on a 17.7 head) printed and worked, but held
# too little of each head (Zeid, 2026-10-30). Both designs below use Slot hook 1U (its
# top is a slot's top edge, so parts line up with the cells). short_head: the dovetail
# head only on the top `head` mm and just the spine below, so the roof that seats the
# next hook fits under the short head while the spine passes it in the open spine
# channel. skip_row: normal hooks and their full rail, a seat on every second row.
# Hook and pocket values come from ../../panel.yaml via ../../hook_geometry.py.
unit:
  rows: 3                    # Zeid asked: a plate for 3 1U hooks

designs:                     # each builds its own plate, hooks and 3MFs
  short_head:                # option 2, Zeid picked it 2026-10-30
    file_prefix: segmented_short_head
    head: 11.0               # dovetail head on the top 11 of Slot hook 1U's 16.3 front: 2 x head + 2 x 0.4 + roof 2.6 = 25.4
    every: 1                 # a seat on every row
    lip: 11.0                # the whole short head; the bottom 0.75 is a 45 deg ramp that steers the heads in
    window: 11.8             # full-width opening the 11 head goes in by: 0.4 above and below it at the push height
    push: 11.4               # how high the plate is held going on, and how far it is then pushed down
  skip_row:                  # option 1 (Zeid's idea): after "we just made it weaker" (Zeid, 2026-10-30), the full rail on normal hooks
    file_prefix: segmented_skip_row
    head: null               # normal Slot hook 1U, the full 16.3 rail
    every: 2                 # a seat on every second row; the rows between stay empty (a hook there hits the wall)
    lip: 16.3                # the whole rail
    window: 22.6             # the 16.3 head goes in anywhere in it: 3.1 of aim up and down at the push height
    push: 16.7               # 0.4 more than the lips, so the head clears them going on
floor: 2.0                   # solid under the lowest window

plate:
  half_width: 8.0            # as the tool bin and tray pocket coupons
  front_wall: 2.0            # as the tool bins and drawer housing: solid in front of the pocket floor (or its gable)
  top: 2.5                   # solid over the top seat's gable
  chamfer: 0.6               # 45 deg on every outside edge (no sharp corners on a test piece)

orientations:                # Zeid, 2026-10-30: shelves and bins print upright, the drawer case pocket face down, no supports
  back:                      # on its back, as the drawer housing: its print-tested pocket and 45 deg gables
    pocket: {spine_clearance: -0.1, flank_gap: 0.1, ridge_height: 0.53}
    print: {}                # the template, as the drawer housing
  upright:                   # as it hangs, as the tool bins: their print-tested pocket and gable seats
    pocket: {spine_clearance: 0.15, flank_gap: 0.1, ridge_height: 0.40}
    print: {sparse_infill_density: 10%, sparse_infill_pattern: zig-zag, wall_generator: arachne, wall_loops: 3, layer_height: 0.2}

print:                       # Bambu Studio settings per object, on top of ../../../bambu/project_settings.config
  hook:                      # as ../../hook/params.yaml: 0.12 layers, 5 walls, Arachne, fit faces as outer walls
    layer_height: 0.12
    wall_loops: 5
    wall_generator: arachne
    wall_sequence: inner-outer-inner wall
