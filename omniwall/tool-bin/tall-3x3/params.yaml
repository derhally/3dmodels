# Tall bin 3 x 3: a taller back for long tools, the sides falling to the front in one S (concept 3).
# Everything not set here comes from ../params.yaml.
unit:
  file_prefix: tool_bin_tall_3x3
  pattern: square

bin:
  cells: 3                   # given (Zeid kept concept 3): 75.9 wide, two hook columns
  rows: 3                    # given: 75.9 tall at the back
  front_height: 50.5         # assumed: two rows' height at the front, the grid sits under it
