# Split bin 4 x 2: a wall down the middle, the grid on the left, an open well on the right (concept 4).
# Everything not set here comes from ../params.yaml.
unit:
  file_prefix: tool_bin_split_4x2x65
  pattern: square

bin:
  cells: 4                   # given (Zeid kept concept 4): 101.3 wide, three hook columns
  rows: 2                    # given: 50.5 tall
  divider: 2.4               # assumed: a wall as thick as the others, centred; the grid goes on the left

grid:
  square_cell: 11.0          # assumed: three cells across the 46 wide grid once the tab strips are in (11.6 x 13.2; 13 gives two 18 wide)
